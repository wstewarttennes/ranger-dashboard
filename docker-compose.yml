services:
  dashboard:
    build: .
    ports:
      - "8089:8088"
    volumes:
      # Live-reload: mount source code for development
      - ./src:/app/src
      - ./dbc:/app/dbc
      - ./config.yaml:/app/config.yaml
    # Host networking required for SocketCAN (can0) access on Pi
    # Comment out 'ports' above and uncomment below for Pi deployment:
    # network_mode: host
    privileged: true  # Required for terminal PTY access
    environment:
      - TERM=xterm-256color
    restart: unless-stopped
