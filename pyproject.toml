[project]
name = "ranger-dashboard"
version = "0.1.0"
description = "1986 Ford Ranger EV dashboard - CAN bus monitor + comma.ai integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "python-can>=4.3",
    "cantools>=39.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "paho-mqtt>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
